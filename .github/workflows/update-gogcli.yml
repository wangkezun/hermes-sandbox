name: Update gogcli version

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest gogcli version
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(gh release view --repo openclaw/gogcli --json tagName -q '.tagName' | sed 's/^v//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Read current version
        id: current
        run: |
          version=$(grep -E '^ARG GOG_VERSION=' Dockerfile | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update Dockerfile
        if: steps.latest.outputs.version != steps.current.outputs.version
        run: |
          sed -i "s/^ARG GOG_VERSION=.*/ARG GOG_VERSION=${{ steps.latest.outputs.version }}/" Dockerfile

      - name: Create pull request
        if: steps.latest.outputs.version != steps.current.outputs.version
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump gogcli to ${{ steps.latest.outputs.version }}"
          branch: chore/bump-gogcli-${{ steps.latest.outputs.version }}
          delete-branch: true
          title: "chore: bump gogcli to ${{ steps.latest.outputs.version }}"
          body: |
            Auto-update `gogcli` from `${{ steps.current.outputs.version }}` to `${{ steps.latest.outputs.version }}`.

            Upstream release: https://github.com/openclaw/gogcli/releases/tag/v${{ steps.latest.outputs.version }}
